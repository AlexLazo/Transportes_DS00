{% extends "base.html" %}
{% block title %}Configuración inicial{% endblock %}
{% block anon %}
<div class="login">
  <h1>Primer uso</h1>
  <p class="muted">Crea el usuario administrador. Después podrás agregar a los demás desde «Usuarios».</p>
  <form method="post" class="card form-row">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <input type="hidden" name="token" value="{{ request.args.get('token', '') }}">
    <div><label for="nombre">Nombre completo</label><input id="nombre" name="nombre" type="text" required style="width:100%"></div>
    <div><label for="usuario">Usuario</label><input id="usuario" name="usuario" type="text" autocomplete="username" required style="width:100%"></div>
    <div><label for="clave">Contraseña (mínimo 10 caracteres)</label><input id="clave" name="clave" type="password" autocomplete="new-password" required style="width:100%"></div>
    <div><label for="clave2">Repite la contraseña</label><input id="clave2" name="clave2" type="password" autocomplete="new-password" required style="width:100%"></div>
    <button class="btn primary">Crear administrador</button>
  </form>
</div>
{% endblock %}
